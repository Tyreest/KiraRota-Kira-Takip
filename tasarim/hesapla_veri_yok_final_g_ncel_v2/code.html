<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-soft-sage docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 max-w-[1200px] mx-auto">
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-on-primary-container tracking-tight">Kira Artışı Hesapla</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop py-lg pb-[100px] md:pb-lg flex justify-center items-start">
<div class="w-full max-w-md bg-surface-lowest border-primary-thin rounded-[16px] p-lg md:p-xl mt-md">
<!-- Input Form Section -->
<form class="flex flex-col gap-lg">
<!-- Current Rent Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant">Mevcut Kira Bedeli</label>
<div class="relative flex items-center">
<span class="absolute left-md font-body-md text-body-md text-on-surface-variant">₺</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-md text-body-md text-on-surface focus:outline-none opacity-70 cursor-not-allowed" disabled="" type="text" value="15.000"/>
</div>
</div>
<!-- Renewal Month Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant">Yenileme tarihi</label>
<div class="relative flex items-center">
<span class="absolute left-md material-symbols-outlined text-primary" data-icon="calendar_month">calendar_month</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface border border-primary rounded-xl font-body-md text-body-md text-primary font-medium focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary cursor-pointer" readonly="" type="text" value="15 Ağustos 2026"/>
</div>
</div>
<!-- Rate Warning Banner -->
<div class="bg-soft-amber/20 border border-soft-amber/50 rounded-xl p-md flex flex-col gap-sm mt-sm">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-dark-charcoal mt-1 text-[20px]" data-icon="info">info</span>
<div class="flex flex-col gap-xs">
<p class="font-label-lg text-label-lg text-dark-charcoal">Ağustos 2026 için oran henüz yok</p>
<p class="font-body-md text-body-md text-dark-charcoal/80 text-sm">Eski oran bu aya uygulanamaz. Son açıklanan oran: <strong>Temmuz 2026</strong>.</p>
</div>
</div>
<div class="bg-surface-lowest/50 rounded-lg p-sm mt-xs border border-dark-charcoal/10">
<p class="font-label-md text-label-md text-dark-charcoal/70 flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="schedule">schedule</span>
                            Not: TÜİK verileri genellikle her ayın ilk günlerinde güncellenir.
                        </p>
</div>
</div>
<!-- Action Button -->
<button class="mt-md w-full h-12 bg-surface-container text-on-surface-variant/50 font-label-lg text-label-lg rounded-xl flex justify-center items-center gap-sm cursor-not-allowed border border-outline-variant/20 transition-all" disabled="" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="calculate">calculate</span>
                    Hesapla
                </button>
</form>
</div>
</main>
