<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-16 pb-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface flex items-center justify-between px-margin-mobile h-16 transition-colors duration-200">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="home_work">home_work</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim font-bold">KiraRota</h1>
</div>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="person">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pt-md">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Kira Artışı Hesapla</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Manuel hesaplama için lütfen bilgileri giriniz.</p>
</div>
<!-- Glassmorphism Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-[0_4px_24px_rgba(6,27,14,0.08)] mb-lg relative overflow-hidden">
<!-- Decorative subtle accent bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-surface-tint opacity-80"></div>
<form class="space-y-md">
<!-- Mevcut Kira -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="current_rent">Mevcut kira (₺)</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="payments">payments</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-10 py-sm font-body-lg text-body-lg text-on-surface transition-colors" id="current_rent" placeholder="Örn: 15000" type="number">
</div>
</div>
<!-- Yenileme Tarihi -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="renewal_date">Yenileme tarihi</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="event">event</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-10 py-sm font-body-lg text-body-lg text-on-surface transition-colors" id="renewal_date" type="month">
</div>
</div>
<!-- Sözleşme Başlangıcı -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="contract_start">Sözleşme başlangıcı (Opsiyonel)</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="history">history</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-10 py-sm font-body-lg text-body-lg text-on-surface transition-colors" id="contract_start" type="date">
</div>
</div>
</form>
</div>
<!-- Info Box -->
<div class="bg-secondary-container rounded-lg p-md flex items-start gap-sm mb-xl shadow-[0_2px_8px_rgba(6,27,14,0.04)]">
<span class="material-symbols-outlined text-primary mt-xs" data-icon="info" data-weight="fill" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-secondary-container">Yenileme tarihine göre ilgili <strong class="font-semibold text-primary">TÜFE 12 aylık ortalama oranı</strong> kullanılır.</p>

<!-- Action Button -->
<div class="fixed bottom-[88px] left-0 right-0 px-margin-mobile z-40 bg-gradient-to-t from-background to-transparent pt-lg pb-sm">

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-150 p-sm rounded-lg" href="#">

<span class="material-symbols-outlined mb-xs" data-icon="domain">domain</span>
<span class="font-label-sm text-label-sm">Kiralarım</span>
</a>

<span class="material-symbols-outlined mb-xs" data-icon="calculate" data-weight="fill" style="font-variation-settings: 'FILL' 1;">calculate</span>
<span class="font-label-sm text-label-sm font-semibold">Hesapla</span>
</a>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-150 p-sm rounded-lg" href="#">
<span class="material-symbols-outlined mb-xs" data-icon="trending_up">trending_up</span>
<span class="font-label-sm text-label-sm">Oranlar</span>
</a>
<!-- Settings (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-150 p-sm rounded-lg" href="#">
<span class="material-symbols-outlined mb-xs" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Ayarlar</span>
</a>
</nav>
<script>
        // Simple micro-interaction for input fields to ensure label feels connected
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('opacity-100');
            });
            input.addEventListener('blur', () => {
                if(!input.value) {
                     input.parentElement.parentElement.classList.remove('opacity-100');
                }
            });
        });
    </script>
