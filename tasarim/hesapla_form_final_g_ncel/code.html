<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kira Artışı Hesapla</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#5c4100",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#eae7e7",
                        "surface-bright": "#fcf9f8",
                        "on-primary-fixed": "#002116",
                        "on-secondary-fixed": "#082014",
                        "on-surface": "#1b1c1c",
                        "on-secondary-fixed-variant": "#344c3e",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#e4aa1d",
                        "inverse-on-surface": "#f3f0f0",
                        "surface-variant": "#e4e2e1",
                        "surface-container-highest": "#e4e2e1",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "primary-fixed": "#bbedd6",
                        "on-error": "#ffffff",
                        "outline": "#717974",
                        "on-secondary-container": "#506859",
                        "on-surface-variant": "#414944",
                        "on-tertiary-fixed": "#261900",
                        "surface-tint": "#396755",
                        "secondary-fixed-dim": "#b2cdbb",
                        "secondary": "#4c6455",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c0c8c3",
                        "tertiary": "#3f2c00",
                        "secondary-container": "#cbe6d4",
                        "on-primary-fixed-variant": "#204f3e",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#8ebea8",
                        "inverse-surface": "#303030",
                        "surface": "#fcf9f8",
                        "primary": "#023727",
                        "on-tertiary-fixed-variant": "#5d4200",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#a0d1bb",
                        "surface-container-low": "#f6f3f2",
                        "surface-container": "#f0eded",
                        "primary-container": "#1f4e3d",
                        "tertiary-fixed": "#ffdea4",
                        "background": "#fcf9f8",
                        "primary-fixed-dim": "#a0d1bb",
                        "on-background": "#1b1c1c",
                        "tertiary-fixed-dim": "#fabd32",
                        "secondary-fixed": "#cee9d6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "lg": "24px",
                        "md": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Montserrat"],
                        "result-value": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "label-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "result-value": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            }
        }
    </script>
<style>
        body { background-color: #F7F4EF; } /* Force Warm Cream background outside of tailwind for global scope */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-padding h-16 px-gutter bg-surface dark:bg-surface border-b border-secondary/10 sticky top-0 z-50">
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-on-primary-container">Kira Artışı Hesapla</h1>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop py-lg space-y-lg flex flex-col">
<!-- Meta Info -->
<div class="text-center text-on-surface-variant font-label-md text-label-md">
            Son güncelleme: 3 Ağustos 2026
        </div>
<!-- Segmented Control -->
<div class="bg-surface-variant/30 p-1 rounded-xl flex border border-secondary/10 mx-auto w-full max-w-md">
<button class="flex-1 py-2 text-center rounded-lg bg-surface text-primary font-label-lg text-label-lg shadow-sm border border-secondary/5 transition-all">Konut</button>
<button class="flex-1 py-2 text-center rounded-lg text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-low transition-all">Çatılı işyeri</button>
</div>
<!-- Calculation Form -->
<div class="bg-surface rounded-2xl border border-secondary/10 p-gutter md:p-lg space-y-lg max-w-md mx-auto w-full">
<!-- Input: Mevcut aylık kira -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="current_rent">Mevcut aylık kira</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-on-surface-variant font-body-lg">₺</span>
<input class="pl-8 block w-full rounded-xl border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-primary h-12" id="current_rent" placeholder="0" type="text" value="25.000"/>
</div>
</div>
<!-- Input: Yenileme ayı -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="renewal_month">Yenileme tarihi</label>
<div class="relative">
<input class="block w-full rounded-xl border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-primary h-12 pr-10 cursor-pointer" id="renewal_month" readonly="" type="text" value="15 Temmuz 2026"/>
<span class="material-symbols-outlined absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Input: Sözleşme başlangıç tarihi -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="start_date">Sözleşme başlangıç tarihi</label>
<div class="relative">
<input class="block w-full rounded-xl border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-primary h-12 pr-10 cursor-pointer" id="start_date" readonly="" type="text" value="15 Temmuz 2023"/>
<span class="material-symbols-outlined absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Input: Sözleşmedeki artış oranı % -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface" for="custom_rate">Sözleşmedeki artış oranı % <span class="text-on-surface-variant font-label-md text-label-md ml-1 font-normal">(Opsiyonel)</span></label>
<div class="relative">
<input class="block w-full rounded-xl border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-primary h-12 pr-10" id="custom_rate" placeholder="Örn: 25" type="text"/>
<span class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant font-body-lg pointer-events-none">%</span>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-on-primary h-12 rounded-xl font-label-lg text-label-lg border-b-[1.5px] border-tertiary-container hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="calculate">calculate</span>
                Hesapla
            </button>
</div>
<!-- Information Banners -->
<div class="max-w-md mx-auto w-full space-y-md">
<div class="bg-[#F0B429]/20 text-[#261900] p-md rounded-xl flex items-start gap-md border border-[#F0B429]/30">
<span class="material-symbols-outlined text-[#5c4100]" data-icon="info">info</span>
<p class="font-body-md text-body-md">Hesaplama, açıklanan en güncel TÜFE oranlarına dayanmaktadır.</p>
</div>
<div class="text-center text-on-surface-variant/70 font-label-md text-label-md px-lg">
                Hesaplamalar tahmindir; hukuki tavsiye değildir. Resmi TÜİK uygulaması değildir.
            </div>
</div>
</main>
<!-- BottomNavBar (Mobile only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface dark:bg-surface border-t border-outline-variant/10 shadow-[0_-4px_16px_rgba(0,0,0,0.05)]">
<!-- Active Tab -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-primary-container text-primary dark:text-on-primary-container rounded-xl px-5 py-1 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined font-bold" data-icon="calculate" data-weight="fill" style="font-variation-settings: 'FILL' 1;">calculate</span>
<span class="font-label-lg text-label-lg mt-1">Hesapla</span>
</button>
<!-- Inactive Tabs -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high transition-all rounded-xl">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
<span class="font-label-lg text-label-lg mt-1 text-[12px]">Oranlar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high transition-all rounded-xl">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-lg text-label-lg mt-1 text-[12px]">Geçmiş</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high transition-all rounded-xl">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-lg text-label-lg mt-1 text-[12px]">Ayarlar</span>
</button>
</nav>
</body></html>
