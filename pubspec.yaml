name: kira_artisi_hesapla
description: "KiraRota — kira takibi ve TÜFE esaslı kira artışı hesaplama."
publish_to: "none"
version: 1.1.0+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  http: ^1.4.0
  intl: ^0.20.2
  share_plus: ^11.0.0
  google_fonts: ^8.2.1
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  in_app_purchase: ^3.3.0
  google_mobile_ads: ^9.0.0
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.1
  crypto: ^3.0.7
  file_saver: ^0.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/tufe_rates.json
    - assets/legal/gizlilik.md
    - assets/legal/kullanim_sartlari.md
    - assets/legal/yasal_uyari.md
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSans-Italic.ttf

flutter_launcher_icons:
  android: true
  ios: false
  # Legacy full icon (rounded plate) — Play Store 512 ayrı; adaptive FG şeffaf sembol.
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#1F4E3D"
  # Şeffaf foreground (ev + grafik); plate yok. Yeniden üret: tool/fix_adaptive_launcher_icon.py
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  min_sdk_android: 23
